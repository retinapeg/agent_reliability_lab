[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Does independent agent review catch coding defects that deterministic tests miss, and at what cost?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pytest>=8.0"]

[project.scripts]
arl = "agent_reliability.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
